name: Release SBOM deploy proof

on:
  push:
    branches:
      - feat/release-sbom-deploy-proof
  pull_request:

jobs:
  deploy-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install parent snapshot
        run: mvn -B -ntp -DskipTests install
      - name: Run deterministic deploy fixture
        run: >-
          mvn -B -ntp
          org.apache.maven.plugins:maven-invoker-plugin:3.10.1:run
          -DprojectsDirectory=src/it
          -DcloneProjectsTo=target/it
          -DlocalRepositoryPath=target/it-local-repository
          -DstreamLogs=true
